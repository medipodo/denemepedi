<!doctype html>
<html lang="tr">
    <head>
        <meta charset="utf-8" />

        <!-- Fonts: Poppins (modern rounded geometric sans) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

        
        <!-- PRODUCTION ENVIRONMENT - SEO Enabled -->
        <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
        <meta name="googlebot" content="index, follow" />
        <meta name="bingbot" content="index, follow" />
        
        <!-- Favicon -->
        <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/favicon-48x48.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
        <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
        
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#ffffff" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <!-- SEO Meta Tags are managed dynamically by react-helmet-async -->
        
        <!-- Keywords -->
        <meta name="keywords" content="pedizone, ayak bakımı, tırnak bakımı, ayak mantarı, çatlak topuk, podolog, ayak sağlığı, foot care, nail care" />
        
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <!-- Title is managed by react-helmet-async via HelmetProvider defaultTitle in App.js to avoid duplicate <title> tags on SPA route changes -->
        <title>PediZone® - Profesyonel Ayak Bakım Ürünleri</title>
        

    </head>
    <body>
        <noscript>PediZone® - Profesyonel Ayak Bakım Ürünleri. Podologların önerileri ve beklentilerine yönelik hazırlanan etkili ayak bakım ürünleri. Ayak mantarı, tırnak bakımı, çatlak topuk çözümleri. Lütfen tam deneyim için JavaScript'i etkinleştirin.</noscript>
        <div id="root"></div>
    </body>
</html>
